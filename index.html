<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout loja</title>
</head>

<body>
    <header>
        <a href="/">SafeCheckout</a>
    </header>
    <hr>
    <main>
        <section>
            <h2>Checkout</h2>
            <p>Shipping Information</p>
            <label for="Delivery">
                <input type="radio" id="Delivery" name="delivery" value="Delivery">
                <i class="ti ti-truck-delivery"></i>
                Delivery
            </label>
            <label for="Pick up">
                <input type="radio" id="Pick up" name="pick up" value="Pick up">
                <i class="ti ti-package"></i>
                Pick up
            </label>
            <hr>
            <form>
                <label for="name">Full name</label><br>
                <input type="text" id="name" name="name" value="" placeholder="Enter full name"><br>
                <label for="Email">Email address</label><br>
                <input type="text" id="Email" name="email" value="" placeholder="Enter email address"><br>
                <label for="number">Phone number</label><br>
                <div>
                    <select>
                        <option value="Estados Unidos">🇺🇸</option>
                        <option value="Brasil">🇧🇷</option>
                    </select>
                    <input type="text" id="number" name="Phone" value="" placeholder="Enter phone number">
                </div>
                <label for="Country">Country</label><br>
                <select>
                    <option value="" disabled selected>Choose country</option>
                    <option value="Estados Unidos">Estados Unidos</option>
                    <option value="Brasil">Brasil</option>
                </select>
                <br>
                <label for="City">City</label><br>
                <input type="text" id="city" name="City" placeholder="Enter city">
                <label for="State">State</label>
                <input type="text" id="state" name="State" placeholder="Enter state">
                <label for="Code">ZIP Code</label>
                <input type="text" id="ZIP" name="Code" placeholder="Enter ZIP code">
                <input type="checkbox" id="Terms" name="Conditions">
                <label for="Terms">I have read and agree to the Terms and Conditions</label>
            </form>
        </section>
        <hr>
        <section>
            <p>Review your cart</p>
            <div>
                <img src="" alt="">
                <p>DuoComfort Sofa Premium</p>
                <p>1x</p>
                <p>$20,00</p>
            </div>
            <div>
                <img src="" alt="">
                <p>IronOne Desk</p>
                <p>1x</p>
                <p>$25,00</p>
            </div>
            <div>

            </div>
        </section>
    </main>
</body>

</html>
